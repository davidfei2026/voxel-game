<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfinityCraft 3D Engine</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Three.js Framework via CDN -->
    <script src="https://cloudflare.com"></script>
    <!-- Load First-Person Camera System Module Extension -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="hud-container">
        <h1>InfinityCraft Engine</h1>
        <p>• Click window to lock mouse controls</p>
        <p>• <strong>W, A, S, D</strong> to run / <strong>Space</strong> to jump</p>
        <p>• <strong>Left-Click</strong>: Mine / <strong>Right-Click</strong>: Build</p>
        <p>• <strong>Keys 1 - 5</strong>: Swap Inventory Materials</p>
    </div>

    <!-- Hotbar Overlay Layout Interface -->
    <div id="hotbar">
        <div class="slot active" data-slot="0" data-block="grass"><div class="badge">1</div><div class="cube grass"></div></div>
        <div class="slot" data-slot="1" data-block="dirt"><div class="badge">2</div><div class="cube dirt"></div></div>
        <div class="slot" data-slot="2" data-block="stone"><div class="badge">3</div><div class="cube stone"></div></div>
        <div class="slot" data-slot="3" data-block="wood"><div class="badge">4</div><div class="cube wood"></div></div>
        <div class="slot" data-slot="4" data-block="leaves"><div class="badge">5</div><div class="cube leaves"></div></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
