<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Mini Minecraft from Scratch</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; margin: -5px 0 0 -5px;
            color: white; font-weight: bold; font-size: 16px;
            pointer-events: none; text-shadow: 1px 1px 1px black;
        }
        #ui {
            position: absolute; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.6);
            padding: 12px; border-radius: 6px; pointer-events: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="ui">
        <strong>Mini JS Minecraft Engine</strong><br>
        1. Click Screen to Lock Mouse Cursor<br>
        2. Move Mouse to Look Around<br>
        3. WASD Keys = Walk<br>
        4. Left Click = Break Block<br>
        5. Right Click = Place Block
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 1. WEBGL SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const gl = canvas.getContext('webgl');
        if (!gl) alert('WebGL not supported!');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 2. SHADERS (GPU Programs) ---
        const vsSource = `
            attribute vec4 aPosition;
            attribute vec4 aColor;
            varying lowp vec4 vColor;
            uniform mat4 uViewMatrix;
            uniform mat4 uProjectionMatrix;
            uniform vec3 uBlockOffset;
            void main() {
                vec4 position = aPosition + vec4(uBlockOffset, 0.0);
                gl_Position = uProjectionMatrix * uViewMatrix * position;
                vColor = aColor;
            }
        `;
        const fsSource = `varying lowp vec4 vColor; void main() { gl_FragColor = vColor; }`;

        function loadShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }
        const shaderProgram = gl.createProgram();
        gl.attachShader(shaderProgram, loadShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(shaderProgram, loadShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(shaderProgram);
        gl.useProgram(shaderProgram);

        const programInfo = {
            attribLocations: { position: gl.getAttribLocation(shaderProgram, 'aPosition'), color: gl.getAttribLocation(shaderProgram, 'aColor') },
            uniformLocations: { projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'), viewMatrix: gl.getUniformLocation(shaderProgram, 'uViewMatrix'), blockOffset: gl.getUniformLocation(shaderProgram, 'uBlockOffset') }
        };

        // --- 3. CORE GEOMETRY CUBE DATA ---
        const positions = [
            -0.5,-0.5, 0.5,  0.5,-0.5, 0.5,  0.5, 0.5, 0.5, -0.5, 0.5, 0.5, // Front
            -0.5,-0.5,-0.5, -0.5, 0.5,-0.5,  0.5, 0.5,-0.5,  0.5,-0.5,-0.5, // Back
            -0.5, 0.5,-0.5, -0.5, 0.5, 0.5,  0.5, 0.5, 0.5,  0.5, 0.5,-0.5, // Top
            -0.5,-0.5,-0.5,  0.5,-0.5,-0.5,  0.5,-0.5, 0.5, -0.5,-0.5, 0.5, // Bottom
             0.5,-0.5,-0.5,  0.5, 0.5,-0.5,  0.5, 0.5, 0.5,  0.5,-0.5, 0.5, // Right
            -0.5,-0.5,-0.5, -0.5,-0.5, 0.5, -0.5, 0.5, 0.5, -0.5, 0.5,-0.5, // Left
        ];
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

        const faceColors = [
            [0.5, 0.3, 0.1, 1.0], [0.5, 0.3, 0.1, 1.0], // Side Dirt
            [0.2, 0.8, 0.2, 1.0], [0.4, 0.2, 0.1, 1.0], // Grass Top, Dirt Bottom
            [0.5, 0.3, 0.1, 1.0], [0.5, 0.3, 0.1, 1.0]  // Side Dirt
        ];
        let colors = [];
        for (let c of faceColors) { colors = colors.concat(c, c, c, c); }
        const colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);

        const indices = [
            0,1,2, 0,2,3, 4,5,6, 4,6,7, 8,9,10, 8,10,11,
            12,13,14, 12,14,15, 16,17,18, 16,18,19, 20,21,22, 20,22,23
        ];
        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

        // --- 4. WORLD MAP GENERATION AND DATABASE ---
        const WORLD_X = 16, WORLD_Y = 16, WORLD_Z = 16;
        const map = [];
        for (let x = 0; x < WORLD_X; x++) {
            map[x] = [];
            for (let y = 0; y < WORLD_Y; y++) {
                map[x][y] = [];
                for (let z = 0; z < WORLD_Z; z++) {
                    // Generate a small bedrock-style base floor so you don't fall forever
                    map[x][y][z] = (y === 0) ? 1 : 0;
                }
            }
        }

        // --- 5. CAMERA & TRUE MOUSE CONTROLS ---
        let camX = 8, camY = 3, camZ = 8;
        let yaw = -Math.PI / 2, pitch = 0;
        const keys = {};

        // Pointer Lock Mechanism: Traps cursor inside engine window canvas
        canvas.addEventListener('click', () => { canvas.requestPointerLock(); });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === canvas) {
                yaw += e.movementX * 0.0025;
                pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch - e.movementY * 0.0025));
            }
        });

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function updateMovement() {
            const speed = 0.1;
            const fx = Math.cos(yaw), fz = Math.sin(yaw); // Flat movement values
            const rx = -Math.sin(yaw), rz = Math.cos(yaw);

            if (keys['w']) { camX += fx * speed; camZ += fz * speed; }
            if (keys['s']) { camX -= fx * speed; camZ -= fz * speed; }
            if (keys['a']) { camX -= rx * speed; camZ -= rz * speed; }
            if (keys['d']) { camX += rx * speed; camZ += rz * speed; }
        }

        // --- 6. RAYCAST INTERACTION MECHANICS (Build & Break) ---
        function performRaycast(isPlaceMode) {
            // Forward shooting directional logic
            const dx = Math.cos(yaw) * Math.cos(pitch);
            const dy = Math.sin(pitch);
            const dz = Math.sin(yaw) * Math.cos(pitch);

            let px = camX, py = camY, pz = camZ;
            let lastPos = null;

            // Step forward through space incrementally looking for collisions
            for (let i = 0; i < 40; i++) {
                px += dx * 0.15; py += dy * 0.15; pz += dz * 0.15;

                let ix = Math.round(px), iy = Math.round(py), iz = Math.round(pz);
                
                // If the ray stays inside grid coordinate maps
                if (ix >= 0 && ix < WORLD_X && iy >= 0 && iy < WORLD_Y && iz >= 0 && iz < WORLD_Z) {
                    if (map[ix][iy][iz] === 1) { // Hit solid map block!
                        if (isPlaceMode && lastPos) {
                            map[lastPos.x][lastPos.y][lastPos.z] = 1; // Add Block
                        } else if (!isPlaceMode) {
                            map[ix][iy][iz] = 0; // Destroy Block
                        }
                        break;
                    }
                    lastPos = { x: ix, y: iy, z: iz };
                }
            }
        }

        // Trigger building/breaking on actual mouse clicks
        document.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== canvas) return;
            if (e.button === 0) performRaycast(false); // Left Click = Break
            if (e.button === 2) performRaycast(true);  // Right Click = Place
        });
        window.addEventListener('contextmenu', e => e.preventDefault()); // Stop right-click menu popups

        // Matrix Math Library Generators
        function makePerspective(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,(2*far*near)/(near-far),0];
        }
        function makeLookAt(px, py, pz, tx, ty, tz) {
            let fx = tx - px, fy = ty - py, fz = tz - pz;
            let r_f = 1 / Math.sqrt(fx*fx + fy*fy + fz*fz); fx *= r_f; fy *= r_f; fz *= r_f;
            let rx = fz, ry = 0, rz = -fx; 
            let r_r = 1 / Math.sqrt(rx*rx + ry*ry + rz*rz); rx *= r_r; ry *= r_r; rz *= r_r;
            let ux = fy*rz - fz*ry, uy = fz*rx - fx*rz, uz = fx*ry - fy*rx;
            return [rx, ux, -fx, 0, ry, uy, -fy, 0, rz, uz, -fz, 0, -(rx*px + ry*py + rz*pz), -(ux*px + uy*py + uz*pz), (fx*px + fy*py + fz*pz), 1];
        }

        // --- 7. RENDERING LOOP GAME engine PASS ---
        function render() {
            updateMovement();

            gl.clearColor(0.53, 0.81, 0.92, 1.0);
            gl.clearDepth(1.0);
            gl.enable(gl.DEPTH_TEST);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            const projectionMatrix = makePerspective(45 * Math.PI / 180, canvas.width / canvas.height, 0.1, 100.0);
            const lx = camX + Math.cos(yaw) * Math.cos(pitch);
            const ly = camY + Math.sin(pitch);
