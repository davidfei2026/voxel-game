<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free Browser Minecraft Clone</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 14px; height: 14px; margin: -7px 0 0 -7px;
            color: white; font-weight: bold; font-size: 20px;
            pointer-events: none; text-shadow: 1px 1px 2px black;
            display: flex; align-items: center; justify-content: center;
        }
        #ui {
            position: absolute; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.75);
            padding: 15px; border-radius: 8px; pointer-events: none;
            line-height: 1.5; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.6);
            padding: 8px; border-radius: 6px; display: flex; gap: 10px;
            border: 2px solid #555; pointer-events: none;
        }
        .slot {
            width: 40px; height: 40px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; border: 2px solid transparent;
            font-size: 12px; text-shadow: 1px 1px 1px black;
        }
        .active { border-color: #fff; background: rgba(255,255,255,0.2); }
        .slot-1 { background: #228B22; } /* Grass Color */
        .slot-2 { background: #8B4513; } /* Dirt Color */
        .slot-3 { background: #808080; } /* Stone Color */
        .slot-4 { background: #CD853F; } /* Wood Color */
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="ui">
        <strong style="color: #4CAF50; font-size: 16px;">My 3D Voxel Sandbox</strong><br>
        • Click screen to lock mouse cursor<br>
        • Move mouse to look around<br>
        • WASD keys = Walk around<br>
        • Left Click = Break block<br>
        • Right Click = Place block<br>
        • Keys 1, 2, 3, 4 = Switch materials
    </div>

    <div id="hotbar">
        <div id="slot-1" class="slot slot-1 active">1</div>
        <div id="slot-2" class="slot slot-2">2</div>
        <div id="slot-3" class="slot slot-3">3</div>
        <div id="slot-4" class="slot slot-4">4</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 1. WEBGL ENGINE CONTEXT ---
        const canvas = document.getElementById('gameCanvas');
        const gl = canvas.getContext('webgl');
        if (!gl) alert('WebGL not supported by this browser!');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 2. GPU SHADERS ---
        const vsSource = `
            attribute vec4 aPosition;
            attribute vec4 aColor;
            varying lowp vec4 vColor;
            uniform mat4 uViewMatrix;
            uniform mat4 uProjectionMatrix;
            uniform vec3 uBlockOffset;
            void main() {
                vec4 position = aPosition + vec4(uBlockOffset, 0.0);
                gl_Position = uProjectionMatrix * uViewMatrix * position;
                vColor = aColor;
            }
        `;
        const fsSource = `varying lowp vec4 vColor; void main() { gl_FragColor = vColor; }`;

        function loadShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }
        const shaderProgram = gl.createProgram();
        gl.attachShader(shaderProgram, loadShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(shaderProgram, loadShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(shaderProgram);
        gl.useProgram(shaderProgram);

        const programInfo = {
            attribLocations: { position: gl.getAttribLocation(shaderProgram, 'aPosition'), color: gl.getAttribLocation(shaderProgram, 'aColor') },
            uniformLocations: { projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'), viewMatrix: gl.getUniformLocation(shaderProgram, 'uViewMatrix'), blockOffset: gl.getUniformLocation(shaderProgram, 'uBlockOffset') }
        };

        // --- 3. GEOMETRY CUBE BUFFERS ---
        const positions = [
            -0.5,-0.5, 0.5,  0.5,-0.5, 0.5,  0.5, 0.5, 0.5, -0.5, 0.5, 0.5, // Front
            -0.5,-0.5,-0.5, -0.5, 0.5,-0.5,  0.5, 0.5,-0.5,  0.5,-0.5,-0.5, // Back
            -0.5, 0.5,-0.5, -0.5, 0.5, 0.5,  0.5, 0.5, 0.5,  0.5, 0.5,-0.5, // Top
            -0.5,-0.5,-0.5,  0.5,-0.5,-0.5,  0.5,-0.5, 0.5, -0.5,-0.5, 0.5, // Bottom
             0.5,-0.5,-0.5,  0.5, 0.5,-0.5,  0.5, 0.5, 0.5,  0.5,-0.5, 0.5, // Right
            -0.5,-0.5,-0.5, -0.5,-0.5, 0.5, -0.5, 0.5, 0.5, -0.5, 0.5,-0.5, // Left
        ];
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

        // Material Color Maps (Grass, Dirt, Stone, Wood)
        const blockColors = {
            1: [ // Grass
                [0.5, 0.35, 0.2, 1.0], [0.5, 0.35, 0.2, 1.0], // Sides
                [0.2, 0.75, 0.2, 1.0], [0.4, 0.25, 0.1, 1.0], // Top, Bottom
                [0.5, 0.35, 0.2, 1.0], [0.5, 0.35, 0.2, 1.0]
            ],
            2: [ // Dirt
                [0.5, 0.35, 0.2, 1.0], [0.5, 0.35, 0.2, 1.0],
                [0.5, 0.35, 0.2, 1.0], [0.5, 0.35, 0.2, 1.0],
                [0.5, 0.35, 0.2, 1.0], [0.5, 0.35, 0.2, 1.0]
            ],
            3: [ // Stone
                [0.5, 0.5, 0.5, 1.0], [0.5, 0.5, 0.5, 1.0],
                [0.5, 0.5, 0.5, 1.0], [0.5, 0.5, 0.5, 1.0],
                [0.5, 0.5, 0.5, 1.0], [0.5, 0.5, 0.5, 1.0]
            ],
            4: [ // Wood Planks
                [0.8, 0.55, 0.3, 1.0], [0.8, 0.55, 0.3, 1.0],
                [0.8, 0.55, 0.3, 1.0], [0.8, 0.55, 0.3, 1.0],
                [0.8, 0.55, 0.3, 1.0], [0.8, 0.55, 0.3, 1.0]
            ]
        };

        const indices = [
            0,  1,  2,      0,  2,  3,    // front
            4,  5,  6,      4,  6,  7,    // back
            8,  9,  10,     8,  10, 11,   // top
            12, 13, 14,     12, 14, 15,   // bottom
            16, 17, 18,     16, 18, 19,   // right
            20, 21, 22,     20, 22, 23    // left
        ];
        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

        // --- 4. MAP COORDINATE DATABASE ---
        const WORLD_X = 20, WORLD_Y = 10, WORLD_Z = 20;
        const map = [];
        for (let x = 0; x < WORLD_X; x++) {
            map[x] = [];
            for (let y = 0; y < WORLD_Y; y++) {
                map[x][y] = [];
                for (let z = 0; z < WORLD_Z; z++) {
                    let blockType = 0; // Air
                    if (y === 0 || y === 1) blockType = 3; // Stone bottom layers
                    else if (y === 2) blockType = 2;       // Dirt layer
                    else if (y === 3) blockType = 1;       // Grass surface layer
                    map[x][y][z] = blockType; 
                }
            }
        }

        // --- 5. CONTROLS ENGINE & HOTBAR ---
        let camX = 10, camY = 6, camZ = 10;
        let yaw = -Math.PI / 2, pitch = -0.2;
        let currentSelectedMaterial = 1; // Starts on Grass
        const keys = {};

        canvas.addEventListener('click', () => { canvas.requestPointerLock(); });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === canvas) {
                yaw += e.movementX * 0.0025;
                pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch - e.movementY * 0.0025));
            }
        });

        window.addEventListener('keydown', (e) => { 
            keys[e.key.toLowerCase()] = true; 
            
            // Inventory Hotbar switching controls
            if (['1','2','3','4'].includes(e.key)) {
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
                currentSelectedMaterial = parseInt(e.key);
                document.getElementById(`slot-${e.key}`).classList.add('active');
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function updateMovement() {
            const speed = 0.12;
            const fx = Math.cos(yaw), fz = Math.sin(yaw); 
            const rx = -Math.sin(yaw), rz = Math.cos(yaw);

            if (keys['w']) { camX += fx * speed; camZ += fz * speed; }
            if (keys['s']) { camX -= fx * speed; camZ -= fz * speed; }
            if (keys['a']) { camX -= rx * speed; camZ -= rz * speed; }
            if (keys['d']) { camX += rx * speed; camZ += rz * speed; }
        }

        // --- 6. INTERACTION RAYCASTING (Place & Break Blocks) ---
        function performRaycast(isPlaceMode) {
            const dx = Math.cos(yaw) * Math.cos(pitch);
            const dy = Math.sin(pitch);
            const dz = Math.sin(yaw) * Math.cos(pitch);

            let px = camX, py = camY, pz = camZ;
            let lastPos = null;

            for (let i = 0; i < 50; i++) {
                px += dx * 0.12; py += dy * 0.12; pz += dz * 0.12;
                let ix = Math.round(px), iy = Math.round(py), iz = Math.round(pz);
